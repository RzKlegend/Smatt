<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-spinner { display: none; }
        .hidden { display: none; }
        .hero { background: #f8f9fa; padding: 2rem; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Attendance AI</a>
        <div class="d-flex">
            <button class="btn btn-outline-light me-2" onclick="showSection('loginSection')">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div id="alertBox" class="alert alert-danger hidden" role="alert"></div>

    <div id="loginSection">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <h3 class="text-center">System Login</h3>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="email" class="form-control" placeholder="admin@sit.edu">
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control">
                    </div>
                    <button class="btn btn-primary w-100" onclick="handleLogin()">Login</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminSection" class="hidden">
        <h2>Admin Dashboard</h2>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">Register Student (FR3, FR4)</div>
                    <div class="card-body">
                        <input type="text" id="sName" class="form-control mb-2" placeholder="Full Name">
                        <input type="text" id="sRoll" class="form-control mb-2" placeholder="Roll No">
                        <input type="text" id="sBatch" class="form-control mb-2" placeholder="Batch ID (e.g., CS-A)">
                        <label>Reference Photo:</label>
                        <input type="file" id="sPhoto" class="form-control mb-2" accept="image/*">
                        <button class="btn btn-success" onclick="registerStudent()">Register Student</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Quick Actions</div>
                    <div class="card-body">
                        <button class="btn btn-outline-primary w-100 mb-2" onclick="showSection('teacherSection')">Go to Teacher View</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="teacherSection" class="hidden">
        <h2>Mark Attendance</h2>
        <button class="btn btn-sm btn-secondary mb-3" onclick="showSection('adminSection')">Back to Admin</button>
        
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <label>Batch</label>
                        <input type="text" id="tBatch" class="form-control" placeholder="e.g., CS-A">
                    </div>
                    <div class="col-md-3">
                        <label>Subject</label>
                        <input type="text" id="tSubject" class="form-control" placeholder="Software Engineering">
                    </div>
                    <div class="col-md-3">
                        <label>Faculty</label>
                        <input type="text" id="tFaculty" class="form-control" placeholder="Dr. Shwetambari">
                    </div>
                </div>
                
                <div class="mt-4 p-4 border border-dashed text-center bg-light">
                    <h5>Upload Classroom Photo</h5>
                    <input type="file" id="classPhoto" class="form-control w-50 mx-auto" accept="image/*">
                    <br>
                    <button class="btn btn-primary btn-lg" onclick="processAttendance()">
                        Process Attendance
                    </button>
                    
                    <div id="loader" class="loading-spinner mt-3">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p>Scanning faces... (approx 10-15s)</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="resultArea" class="mt-4 hidden">
            <h4>Attendance Result</h4>
            <div class="alert alert-success">
                Faces Detected: <span id="faceCount">0</span>
            </div>
            <a id="downloadBtn" href="#" class="btn btn-success mb-2">Download Excel Report</a>
            <table class="table table-striped">
                <thead><tr><th>Roll No</th><th>Name</th><th>Status</th></tr></thead>
                <tbody id="attendanceTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    // --- FIREBASE CONFIG ---
    // PASTE YOUR FIREBASE CONFIG OBJECT HERE
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "...",
        appId: "..."
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const storage = firebase.storage();
    
    // --- UI LOGIC ---

    function showSection(id) {
        ['loginSection', 'adminSection', 'teacherSection'].forEach(s => {
            document.getElementById(s).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }

    function handleLogin() {
        // Simplified for prototype: Any non-empty login works or use Firebase Auth
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, pass)
            .then(() => showSection('adminSection'))
            .catch(e => alert("Login Failed: " + e.message));
    }

    async function uploadImage(file, path) {
        const ref = storage.ref().child(path + '/' + new Date().getTime() + '_' + file.name);
        await ref.put(file);
        return await ref.getDownloadURL();
    }

    // FR4: Register Student
    async function registerStudent() {
        const file = document.getElementById('sPhoto').files[0];
        if(!file) return alert("Please select a photo");

        try {
            const url = await uploadImage(file, 'students');
            
            const payload = {
                name: document.getElementById('sName').value,
                rollNo: document.getElementById('sRoll').value,
                batchId: document.getElementById('sBatch').value,
                imageUrl: url
            };

            const resp = await fetch('/api/register_student', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const res = await resp.json();
            
            if(res.success) alert("Student Registered!");
            else alert("Error: " + res.error);

        } catch (e) { console.error(e); alert("Registration failed"); }
    }

    // FR9-FR11: Process Attendance
    async function processAttendance() {
        const file = document.getElementById('classPhoto').files[0];
        if(!file) return alert("Upload a class photo");

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultArea').classList.add('hidden');

        try {
            // 1. Upload Class Photo
            const url = await uploadImage(file, 'attendance_uploads');

            // 2. Call Python Backend
            const payload = {
                batchId: document.getElementById('tBatch').value,
                subject: document.getElementById('tSubject').value,
                faculty: document.getElementById('tFaculty').value,
                classPhotoUrl: url
            };

            const resp = await fetch('/api/process_attendance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const res = await resp.json();

            document.getElementById('loader').style.display = 'none';

            if(res.error) {
                alert(res.error);
            } else {
                // Render Results
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('faceCount').innerText = res.present_students.length;
                
                const tbody = document.getElementById('attendanceTable');
                tbody.innerHTML = '';
                res.present_students.forEach(s => {
                    tbody.innerHTML += `<tr><td>${s.rollNo}</td><td>${s.name}</td><td class="text-success">Present</td></tr>`;
                });

                // Setup Excel Download (FR13)
                document.getElementById('downloadBtn').href = `/api/download_report?logId=${res.logId}`;
            }

        } catch (e) {
            document.getElementById('loader').style.display = 'none';
            alert("System Error: " + e.message);
        }
    }
</script>

</body>
</html>
